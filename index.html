    <!-- тема до загрузки бандла: без белой вспышки на старте -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("stopblock.theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.classList.add("tg-" + t);
          document.documentElement.style.backgroundColor =
            t === "light" ? "#ffffff" : "#0b0a11";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute("content", t === "light" ? "#ffffff" : "#0b0a11");
        } catch (e) {
          /* приватный режим — остаёмся в тёмной теме по умолчанию */
        }
      })();
    </script>
